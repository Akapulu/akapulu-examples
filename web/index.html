<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akapulu GPT Live</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div id="app" class="live-call is-idle">
      <div id="banner" class="live-call-banner" hidden role="status"></div>
      <div class="live-call-main">
        <section class="live-call-transcript">
          <h2>Transcript</h2>
          <p id="empty" class="live-call-empty">The conversation shows up here.</p>
          <ol id="transcript"></ol>
        </section>
        <section class="live-call-stage">
          <h1>GPT Live</h1>
          <div class="live-call-screen">
            <video id="avatar" class="live-call-avatar" playsinline autoplay></video>
            <div id="loading" class="live-call-loading" hidden role="status" aria-label="Loading the avatar">
              <span></span>
              <div class="live-call-progress">
                <div class="live-call-track">
                  <div id="fill" class="live-call-fill" style="width: 0%"></div>
                </div>
                <p id="status">Ready</p>
              </div>
            </div>
          </div>
          <div class="live-call-actions">
            <button id="start" type="button">Start Call</button>
            <button id="end" class="is-hangup" type="button" disabled>End call</button>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
